<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DÜPÖN BET</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial}
header{background:#07111f;padding:18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold;color:#ffcc00}
.logo span{color:white}
nav a{color:white;text-decoration:none;margin-left:12px;font-size:14px}
.hero{padding:25px 18px;background:linear-gradient(90deg,#203449,#0f1f33)}
.hero h1{font-size:26px;margin:5px 0}
.hero p{color:#d5e9df}
h2{font-size:19px;margin:22px 15px 12px}
.match{background:#1c2a3d;margin:12px;border-radius:10px;padding:12px}
.league{font-size:12px;color:#aab8ca;margin-bottom:8px}
.teams{display:flex;justify-content:space-between;font-weight:bold}
.odds{display:flex;gap:8px;margin-top:10px}
.odds button{flex:1;background:#2a3c56;border:none;color:white;padding:8px;border-radius:6px}
.odds button:hover{background:#ffcc00;color:black}
</style>
</head>
<body>
<header>
<div class="logo">DÜPÖN <span>BET</span></div>
<nav><a href="#">Foot</a><a href="#">Basket</a><a href="#">Live</a></nav>
</header>
<div class="hero">
<h1>Parie et Gagne</h1>
<p>Cotes boostées - Retrait rapide MTN/Moov</p>
</div>

<h2>Matchs du jour</h2>
<div class="match">
<div class="league">LIGUE 1 • Aujourd'hui 20:45</div>
<div class="teams"><span>Real Madrid</span><span>Barça</span></div>
<div class="odds"><button>1 - 2.10</button><button>X - 3.20</button><button>2 - 3.50</button></div>
</div>

<div class="match">
<div class="league">NHL • Minute 60 - But Oui/Non</div>
<div class="teams"><span>Rangers</span><span>Oilers</span></div>
<div class="odds"><button>Oui - 3.70</button><button>Non - 1.25</button></div>
</div>

<div class="match">
<div class="league">NBA • Ce soir</div>
<div class="teams"><span>Lakers</span><span>Warriors</span></div>
<div class="odds"><button>1 - 1.80</button><button>2 - 2.05</button></div>
</div>

</body>
</html>
