<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DÜPÖN BET - Officiel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e1a2d;color:#fff;font-family:Roboto,Arial,sans-serif;padding-bottom:80px}
.top{background:#042342;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{color:#ffc800;font-weight:900;font-size:22px} .logo span{color:#fff}
.solde-wrap{display:flex;align-items:center;gap:6px;background:#102a4d;border-radius:8px;padding:4px 6px;border:1px solid #1e3a5f}
.solde-wrap small{display:block;font-size:9px;color:#8aa0be} .solde-wrap b{font-size:13px;color:#00ff7f}
.btn-depot{background:#00a54f;color:#fff;border:0;padding:7px 12px;border-radius:6px;font-weight:800;font-size:12px}
.nav2{background:#12315e;display:flex;gap:18px;padding:10px 12px;font-size:13px;font-weight:600;overflow:auto;white-space:nowrap;border-bottom:1px solid #1e3a5f}
.nav2 .active{color:#ffc800;border-bottom:2px solid #ffc800}
.sports-bar{background:#0f2340;display:flex;gap:8px;padding:8px 10px;overflow:auto}
.sports-bar div{background:#1c355e;padding:6px 12px;border-radius:20px;font-size:12px;border:1px solid #2a4a76}
.sports-bar div.active{background:#ffc800;color:#000}
.banner{background:linear-gradient(90deg,#0a3d7a,#1e5bb0);margin:8px;border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.banner h3{font-size:15px} .banner span{background:#ffc800;color:#000;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:800}
.match-day{padding:10px 12px 4px;font-size:13px;font-weight:700;color:#a0b8d0;display:flex;justify-content:space-between}
.card{background:#162c4e;margin:6px 8px;border-radius:10px;overflow:hidden;border:1px solid #20395e}
.card-head{padding:8px 10px;font-size:11px;color:#7ea0c2;display:flex;justify-content:space-between;background:#132340}
.card-teams{padding:10px 10px 6px;display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.card-odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#20395e}
.card-odds button{background:#1c355e;border:0;color:#d0e0f0;padding:12px 4px;font-weight:700;font-size:13px}
.card-odds button.active{background:#ffc800;color:#000} .card-odds button small{display:block;font-size:10px;color:#8aa0be;font-weight:400}
.live-dot{width:6px;height:6px;background:red;border-radius:50%;display:inline-block;margin-right:4px}
.coupon{position:fixed;bottom:58px;left:0;right:0;background:#0f1f38;border-top:2px solid #ffc800;padding:10px 12px;z-index:90;display:none}
.coupon-top{display:flex;justify-content:space-between;font-size:11px;color:#a0b8d0}
.coupon-mid{margin:6px 0;font-size:12px;max-height:60px;overflow:auto}
.coupon-bot{display:flex;gap:6px;align-items:center}
.coupon-bot input{width:75px;background:#0a1526;border:1px solid #2a4a76;color:#fff;padding:10px;border-radius:8px;text-align:center}
.coupon-bot .gain{color:#00ff7f;font-weight:800;font-size:11px;flex:1}
.coupon-bot .place{flex:1;background:#ffc800;color:#000;border:0;padding:12px;border-radius:8px;font-weight:900}
.coupon-bot .share{background:#25D366;color:#fff;border:0;padding:12px;border-radius:8px;font-weight:900}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a1930;display:flex;justify-content:space-around;padding:8px 0 10px;border-top:1px solid #1e3a5f;z-index:100}
.bottom div{text-align:center;font-size:10px;color:#7ea0c2} .bottom div.active{color:#ffc800} .bottom div i{font-size:18px;display:block;font-style:normal}
</style>
</head>
<body>
<div class="top"><div class="logo">DÜPÖN <span>BET</span></div><div class="solde-wrap"><div><small>👛 SOLDE</small><b id="solde">5 000 FCFA</b></div><button class="btn-depot" onclick="depot()">⊕ Dépôt</button></div></div>
<div class="nav2"><div class="active">SPORTS</div><div>EN DIRECT</div><div>AVIATOR</div><div>CASINO</div><div>BONUS</div></div>
<div class="sports-bar"><div class="active">⚽ Foot</div><div>🏀 Basket</div><div>🎾 Tennis</div><div>🏒 Hockey</div></div>
<div class="banner"><h3>Bonus 200% - Code DUPON500</h3><span>Prendre</span></div>
<div class="match-day"><span><span class="live-dot"></span>MATCHS DU JOUR</span><span style="color:#ffc800" id="coteGlobale">Cote: 1.00</span></div>

<div id="matchs-container"></div>

<div class="coupon" id="coupon">
<div class="coupon-top"><span id="nb">0 événement</span><span onclick="clearAll()" style="color:#ff6b6b">Supprimer tout</span></div>
<div class="coupon-mid" id="list"></div>
<div class="coupon-bot">
<input id="mise" type="number" value="500" oninput="calc()">
<span class="gain" id="gain">Gain: 0</span>
<button class="place" onclick="placer()">PARIER</button>
<button class="share" onclick="partagerCoupon()">📸</button>
</div>
</div>

<div class="bottom"><div class="active"><i>⚽</i>SPORTS</div><div><i>🔴</i>LIVE</div><div><i>✈️</i>AVIATOR</div><div><i>🎰</i>CASINO</div>
