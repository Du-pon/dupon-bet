<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DÜPÖN BET</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a1526;color:#fff;font-family:Arial}header{background:#07111f;padding:10px 12px;display:flex;justify-content:space-between;align-items:center} .logo{color:#ffcc00;font-weight:900;font-size:20px} .logo span{color:#fff} .box{background:#13223a;border:1px solid #22385c;border-radius:10px;padding:5px 10px;display:flex;gap:8px;align-items:center} .box b{color:#2eff8a;font-size:13px} .box button{background:#00b85f;border:0;color:#fff;padding:7px 10px;border-radius:7px;font-weight:bold} .m{background:#152641;margin:10px 12px;border-radius:14px;padding:12px} .o{display:flex;gap:6px;margin-top:10px} .o button{flex:1;background:#233a5e;border:1px solid #35527a;color:#fff;padding:10px;border-radius:9px;font-weight:bold} .o button.active{background:#ffcc00;color:#000} .coupon{position:fixed;bottom:0;left:0;right:0;background:#101e33;border-top:2px solid #ffcc00;padding:12px}</style></head><body>
<header><div class="logo">DÜPÖN <span>BET</span></div><div class="box"><div><small style="font-size:9px;color:#8aa0be">👛 SOLDE</small><br><b id="s">5 000 FCFA</b></div><button onclick="depot()">⊕ Dépôt</button></div></header>
<div style="padding:16px"><h2 style="margin:0">Parie et Gagne</h2><p style="color:#9ec0d8;font-size:12px">Clique pour ajouter au coupon</p></div>
<div class="m"><b>Real Madrid - Barça</b><div class="o"><button onclick="add(this,2.1)">1-2.10</button><button onclick="add(this,3.2)">X-3.20</button><button onclick="add(this,3.5)">2-3.50</button></div></div>
<div class="m"><b>Rangers - Oilers</b><div class="o"><button onclick="add(this,3.7)">Oui-3.70</button><button onclick="add(this,1.25)">Non-1.25</button></div></div>
<div class="m"><b>Lakers - Warriors</b><div class="o"><button onclick="add(this,1.8)">1-1.80</button><button onclick="add(this,2.05)">2-2.05</button></div></div>
<div style="height:120px"></div>
<div class="coupon" id="c" style="display:none"><div style="display:flex;justify-content:space-between;font-size:12px"><span id="nb">0 pari</span><span onclick="clearAll()" style="color:#f66">Effacer</span></div><div style="display:flex;gap:8px;margin-top:8px;align-items:center"><input id="mise" type="number" value="500" style="width:80px;padding:10px;border-radius:8px;border:1px solid #35527a;background:#0a1526;color:#fff"> <span id="gain" style="color:#2eff8a;font-weight:bold">Gain: 0</span> <button onclick="placer()" style="flex:1;background:#ffcc00;border:0;padding:12px;border-radius:9px;font-weight:900">PLACER</button></div></div>
<script>
let solde=5000, paris=[], coteT=1;
function add(b,c){if(b.classList.contains('active')){b.classList.remove('active');paris=paris.filter(x=>x.b!=b);coteT/=c}else{b.classList.add('active');paris.push({b,c});coteT*=c}document.getElementById('c').style.display=paris.length?'block':'none';document.getElementById('nb').innerText=paris.length+' pari(s) - Cote '+coteT.toFixed(2);calc()}
function calc(){let m=parseInt(document.getElementById('mise').value)||0;document.getElementById('gain').innerText='Gain: '+(m*coteT).toFixed(0)+' FCFA'}
document.getElementById('mise').addEventListener('input',calc);
function clearAll(){paris.forEach(p=>p.b.classList.remove('active'));paris=[];coteT=1;document.getElementById('c').style.display='none'}
function placer(){let m=parseInt(document.getElementById('mise').value)||0;if(!paris.length||m<=0)return alert('Choisis une cote');if(m>solde)return alert('Solde insuffisant');solde-=m;document.getElementById('s').innerText=solde.toLocaleString()+' FCFA';alert('Pari placé! Gain potentiel '+(m*coteT).toFixed(0)+' FCFA');clearAll()}
function depot(){let d=prompt('Montant:');if(d){let v=parseInt(d);if(!isNaN(v)){solde+=v;document.getElementById('s').innerText=solde.toLocaleString()+' FCFA'}}}
</script></body></html>
