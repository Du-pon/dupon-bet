<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DÜPÖN BET</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1526;color:white;font-family:Arial, sans-serif}
header{background:#07111f;padding:12px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:900;color:#ffcc00;letter-spacing:1px}
.logo span{color:white}
.solde-box{background:#13223a;border:1px solid #22385c;border-radius:10px;padding:5px 6px 5px 10px;display:flex;align-items:center;gap:8px}
.wallet-icon{font-size:18px}
.solde-text{line-height:1.1}
.solde-text small{font-size:10px;color:#8aa0be;display:block;letter-spacing:1px}
.solde-text b{font-size:14px;color:#2eff8a}
.btn-depot{background:#00b85f;border:none;color:white;padding:8px 12px;border-radius:7px;font-weight:bold;font-size:13px}
.hero{padding:22px 18px;background:linear-gradient(135deg,#193054,#0f1f33)}
.hero h1{margin:0;font-size:26px}
.hero p{color:#9ec0d8;margin:6px 0 0;font-size:13px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:16px 12px 0}
.sec-head h2{margin:0;font-size:18px}
.match{background:#152641;margin:10px 12px;border-radius:14px;padding:12px;border:1px solid #22385c}
.league{font-size:11px;color:#7ea0c2;margin-bottom:8px;text-transform:uppercase}
.teams{display:flex;justify-content:space-between;font-weight:bold;font-size:16px}
.odds{display:flex;gap:7px;margin-top:12px}
.odds button{flex:1;background:#233a5e;border:1px solid #35527a;color:white;padding:11px 4px;border-radius:9px;font-weight:bold;font-size:14px}
.odds button.active{background:#ffcc00;color:black;border-color:#ffcc00}
.bet-bar{position:fixed;bottom:0;left:0;right:0;background:#101e33;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #2a3f62}
.bet-bar button{background:#ffcc00;border:none;padding:12px 22px;border-radius:9px;font-weight:900;color:black}
</style>
</head>
<body>
<header>
<div class="logo">DÜPÖN <span>BET</span></div>
<div class="solde-box">
<span class="wallet-icon">👛</span>
<div class="solde-text"><small>👛 SOLDE</small><b id="solde">5 000 FCFA</b></div>
<button class="btn-depot" onclick="depot()">⊕ Dépôt</button>
</div>
</header>

<div class="hero">
<h1>Parie et Gagne</h1>
<p>Cotes boostées - Retrait rapide MTN / Moov</p>
</div>

<div class="sec-head"><h2>Matchs du jour</h2></div>

<div class="match">
<div class="league">Ligue 1 • Aujourd'hui 20:45</div>
<div class="teams"><span>Real Madrid</span><span>Barça</span></div>
<div class="odds">
<button onclick="parier(this,500)">1 - 2.10</button>
<button onclick="parier(this,500)">X - 3.20</button>
<button onclick="parier(this,500)">2 - 3.50</button>
</div>
</div>

<div class="match">
<div class="league">NHL • Minute 60 - But Oui/Non</div>
<div class="teams"><span>Rangers</span><span>Oilers</span></div>
<div class="odds">
<button onclick="parier(this,500)">Oui - 3.70</button>
<button onclick="parier(this,500)">Non - 1.25</button>
</div>
</div>

<div class="match">
<div class="league">NBA • Ce soir</div>
<div class="teams"><span>Lakers</span><span>Warriors</span></div>
<div class="odds">
<button onclick="parier(this,500)">1 - 1.80</button>
<button onclick="parier(this,500)">2 - 2.05</button>
</div>
</div>

<div style="height:90px"></div>

<div class="bet-bar">
<div id="ticket" style="font-size:13px">Aucun pari sélectionné</div>
<button onclick="placer()">Placer</button>
</div>

<script>
let solde = 5000;
let mise = 0;
function parier(btn,m){
 document.querySelectorAll('.odds button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 mise=m;
 document.getElementById('ticket').innerHTML="Mise: "+m+" FCFA • Gain: "+(m*2.1).toFixed(0)+" FCFA";
}
function placer(){
 if(mise==0){alert("Choisis une cote d'abord !");return}
 if(solde<mise){alert("Solde insuffisant ! Fais un dépôt.");return}
 solde-=mise;
 document.getElementById('solde').innerText=solde.toLocaleString()+' FCFA';
 alert("✅ Pari placé ! Nouveau solde: "+solde+" FCFA");
 mise=0;
 document.getElementById('ticket').innerText="Aucun pari sélectionné";
 document.querySelectorAll('.odds button').forEach(b=>b.classList.remove('active'));
}
function depot(){
 let d=prompt("Montant dépôt FCFA (ex: 5000):");
 if(d){let v=parseInt(d); if(!isNaN(v)){solde+=v; document.getElementById('solde').innerText=solde.toLocaleString()+' FCFA'; alert("Dépôt de "+v+" FCFA réussi !")}}
}
</script>
</body>
</html>
