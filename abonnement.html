<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abonnement DÜPÖN BET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0e0e;color:#fff;font-family:Arial;padding:20px}
.box{max-width:400px;margin:30px auto;background:#1c1c1c;border-radius:16px;padding:20px;border:1px solid #2a2a2a;text-align:center}
h1{font-size:22px;margin-bottom:6px}
.sub{color:#8a8a8a;font-size:13px;margin-bottom:20px}
.plan{background:#252525;border-radius:12px;padding:14px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;border:2px solid transparent;cursor:pointer}
.plan.active{border-color:#3aaa35;background:#1e2e1e}
.plan b{color:#fff}
.plan span{color:#8a8a8a;font-size:12px}
.btn{width:100%;background:linear-gradient(#5ec95a,#3aaa35);border:0;padding:15px;border-radius:12px;color:#fff;font-weight:800;font-size:16px;margin-top:16px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin-top:12px}
</style>
</head>
<body>
<div class="box">
<h1>DÜPÖN BET VIP 🔒</h1>
<p class="sub">Abonne-toi pour voir les coupons du jour</p>

<div class="plan active" onclick="selectPlan(this,500,'1 Jour')">
<div><b>1 Jour</b><br><span>Accès 24h</span></div><b>500 FCFA</b>
</div>
<div class="plan" onclick="selectPlan(this,2000,'1 Semaine')">
<div><b>1 Semaine</b><br><span>Le plus populaire</span></div><b>2000 FCFA</b>
</div>
<div class="plan" onclick="selectPlan(this,5000,'1 Mois')">
<div><b>1 Mois</b><br><span>Meilleur prix</span></div><b>5000 FCFA</b>
</div>

<button class="btn" id="payBtn" onclick="payer()">Payer 500 FCFA - MTN MoMo</button>
<p style="margin-top:12px;font-size:12px;color:#777">Après paiement, envoie la capture sur WhatsApp pour recevoir ton code d'accès</p>

<input id="code" placeholder="Entre ton code d'accès ici">
<button class="btn" style="background:#2a2a2a" onclick="verifier()">Débloquer le site</button>
</div>

<script>
let prix=500, nom="1 Jour";
function selectPlan(el,p,n){
document.querySelectorAll('.plan').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
prix=p; nom=n;
document.getElementById('payBtn').innerText="Payer "+p+" FCFA - MTN MoMo";
}
function payer(){
// NUMÉRO À CHANGER
let numero="2290160207296";
let msg="Salut DUPON, je veux l'abonnement "+nom+" à "+prix+" FCFA";
window.open("https://wa.me/"+numero+"?text="+encodeURIComponent(msg), "_blank");
alert("1. Paie sur MoMo\\n2. Envoie capture sur WhatsApp\\n3. Tu recevras un code comme DUPON-1234");
}
function verifier(){
let c=document.getElementById('code').value.trim().toUpperCase();
// CODES QUE TU CRÉES TOI-MÊME
let codesValides=["DUPON-1234","DUPON-VIP","DUPON-2026","TEST-OK"];
if(codesValides.includes(c) || c.startsWith("DUPON-")){
localStorage.setItem("abonne","oui");
localStorage.setItem("abonne_fin", Date.now() + 30*24*60*60*1000); // 30 jours
window.location.href="index.html";
}else{
alert("Code invalide. Contacte WhatsApp.");
}
}
</script>
</body>
</html>
